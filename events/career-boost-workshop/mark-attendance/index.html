<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mark Attendance | Career Boost Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="attendance.css" />
</head>
<body>
  <main class="attendance-shell">
    <section class="top-card">
      <a class="back-link" href="../">Back to Workshop</a>
      <h1>Career Boost Attendance</h1>
      <p>
        Your location must be within 5 km of the workshop point before the attendance form is unlocked.
      </p>
      <div class="target-box">
        Target Location: 28.4758963, 77.4986127
      </div>
      <button id="verifyButton" class="verify-btn" type="button">Verify Location and Open Form</button>
      <p class="helper-text">Location permission is mandatory. Attendance access is one-time only.</p>
    </section>

    <section id="formSection" class="form-card hidden" aria-live="polite">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSfSfzF0GeKtF3GaHGIb7xXFO6k1Se_D_-Gz57B1gq2OLVyBJQ/viewform?embedded=true"
        width="100%"
        height="1760"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Career Boost Workshop Attendance Form"
      >Loading...</iframe>
    </section>
  </main>

  <div id="statusModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card">
      <div class="modal-accent" id="modalAccent"></div>
      <h2 id="modalTitle">Status</h2>
      <p id="modalMessage"></p>
      <button id="modalAction" class="modal-btn" type="button">Close</button>
    </div>
  </div>

  <script src="attendance.js"></script>
</body>
</html>
